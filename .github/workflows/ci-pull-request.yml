name: Android CI

on:
  push:
    branches:
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: touch local.properties

      - name: Run offline raw transaction tests
        run: ./gradlew :ethereumkit:testDebugUnitTest --tests "io.horizontalsystems.ethereumkit.core.RawTransactionBroadcasterTest" --tests "io.horizontalsystems.ethereumkit.core.EthereumKitRawTransactionTest"
