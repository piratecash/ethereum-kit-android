plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
    id 'maven-publish'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
            }
        }
    }
}

android {
    namespace 'io.horizontalsystems.ethereumkit'
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        test.java.srcDirs 'src/test/sharedFixture/kotlin', 'src/test/fixtureSupport/kotlin'
    }
    testOptions {
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
        }
    }

}

room {
    schemaDirectory("$projectDir/schemas")
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation libs.bcpkix.jdk15to18

    implementation libs.hd.wallet.kit.android

    implementation 'io.reactivex.rxjava2:rxjava:2.2.19'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'

    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.google.code.gson:gson:2.9.0'

    def scarlet_version = "0.1.12"
    implementation "com.tinder.scarlet:scarlet:$scarlet_version"
    implementation "com.tinder.scarlet:websocket-okhttp:$scarlet_version"
    implementation "com.tinder.scarlet:stream-adapter-rxjava2:$scarlet_version"
    implementation "com.tinder.scarlet:message-adapter-gson:$scarlet_version"
    implementation "com.tinder.scarlet:lifecycle-android:$scarlet_version"

    api libs.kermit

    // Geth mobile
//    implementation 'org.ethereum:geth:1.8.11';

    // Room
    implementation libs.room.runtime
    ksp libs.room.compiler

    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.rx2

    //Eip712
    implementation('org.web3j:crypto:4.9.4') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }
    api('org.web3j:abi:4.9.8') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }

    // Test helpers
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:3.3.3'
    testImplementation 'com.nhaarman:mockito-kotlin-kt1.1:1.6.0'
    // Mockito 3.3.3 cannot read Java 17 bytecode; new tests use mockk, as :erc20kit already does.
    testImplementation 'io.mockk:mockk:1.13.12'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.0'
    testRuntimeOnly libs.secp256k1.jni.jvm

    // Android Instrumentation Test
    implementation 'androidx.annotation:annotation:1.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'com.linkedin.dexmaker:dexmaker-mockito-inline:2.28.1'
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

repositories {
    mavenCentral()
}
