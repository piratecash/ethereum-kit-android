import org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.3.20'
    ext.room_version = '2.8.4'
    ext.shortSha = providers.environmentVariable("SHORT_SHA")
        .orElse(provider {
            def process = new ProcessBuilder("git", "rev-parse", "--short=7", "HEAD")
                .directory(rootDir)
                .redirectErrorStream(true)
                .start()
            process.inputStream.text.trim() ?: "unknown"
        })
        .get()
    ext.libraryVersion = providers.environmentVariable("JITPACK_VERSION")
        .orElse(providers.environmentVariable("VERSION"))
        .orElse(providers.environmentVariable("VERSION_NAME"))
        .orElse(provider { ext.shortSha })
        .get()
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.room:room-gradle-plugin:$room_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'maven-publish'
    id 'com.google.devtools.ksp' version '2.3.2' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

def libraryModules = [
    'ethereumkit', 'erc20kit', 'uniswapkit', 'oneinchkit', 'nftkit', 'merkleiokit'
]

def artifactNames = [
    'ethereumkit': 'ethereum-kit-core',
    'erc20kit': 'ethereum-kit-erc20',
    'uniswapkit': 'ethereum-kit-uniswap',
    'oneinchkit': 'ethereum-kit-oneinch',
    'nftkit': 'ethereum-kit-nft',
    'merkleiokit': 'ethereum-kit-merkleio'
]

def addLibraryModuleDependencies = { pom ->
    pom.withXml {
        def dependenciesNode = asNode().appendNode('dependencies')
        libraryModules.each { mod ->
            def dependencyNode = dependenciesNode.appendNode('dependency')
            dependencyNode.appendNode('groupId', 'com.github.piratecash.ethereum-kit-android')
            dependencyNode.appendNode('artifactId', artifactNames[mod])
            // Gradle module metadata of the KMP root publication picks the platform artifact.
            dependencyNode.appendNode('version', rootProject.ext.libraryVersion)
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = "com.github.piratecash"
            artifactId = "ethereum-kit-android"
            version = rootProject.ext.libraryVersion
            addLibraryModuleDependencies(pom)
        }
    }
}

subprojects { sub ->
    sub.tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmDefault.set(JvmDefaultMode.DISABLE)
        }
    }

    if (libraryModules.contains(sub.name)) {
        sub.plugins.withId('org.jetbrains.kotlin.multiplatform') { configureKitModule(sub, artifactNames[sub.name]) }
        sub.plugins.withId('androidx.room') { configureRoom(sub) }

        sub.afterEvaluate {
            sub.publishing {
                publications.withType(MavenPublication).configureEach {
                    groupId = "com.github.piratecash.ethereum-kit-android"
                    version = rootProject.ext.libraryVersion
                }
                publications.named('kotlinMultiplatform') { artifactId = artifactNames[sub.name] }
            }
        }
        // AGP's "test" lifecycle task only aggregates Android unit tests; wire in the desktop target too.
        sub.tasks.matching { it.name == 'test' }.configureEach { dependsOn('desktopTest') }
    }
}

// Shared by every kit module: Android + desktop JVM targets over the pre-KMP `src/main/java` layout.
def configureKitModule(Project sub, String artifactName) {
    sub.kotlin {
        // KMP publishes a root artifact plus one per target; equal ids would collide.
        androidTarget {
            publishLibraryVariants('release')
            mavenPublication { artifactId = "$artifactName-android" }
            compilerOptions { jvmTarget.set(JvmTarget.JVM_17) }
        }
        // 21, not 17: hd-wallet-kit-kmp and secp256k1-kmp-jni-jvm publish Java 21 bytecode only.
        jvm('desktop') {
            mavenPublication { artifactId = "$artifactName-desktop" }
            compilerOptions { jvmTarget.set(JvmTarget.JVM_21) }
        }
        compilerOptions {
            freeCompilerArgs.add('-Xexpect-actual-classes')
        }
        sourceSets {
            // Not commonMain: the kit is JVM code shared by the two JVM-backed targets only.
            def jvmCommonMain = create('jvmCommonMain') { dependsOn(commonMain) }
            // Android sources come from AGP's own `main` source set; adding them here too would
            // list the same file in two fragments.
            androidMain { dependsOn(jvmCommonMain) }
            desktopMain {
                kotlin.srcDir('src/main/java')
                dependsOn(jvmCommonMain)
            }
        }
    }
    sub.android {
        compileSdk 34
        // The KMP plugin points AGP at src/androidMain/AndroidManifest.xml; without this the library
        // ships no manifest permissions (ACCESS_NETWORK_STATE for ConnectionManager).
        sourceSets.main.manifest.srcFile 'src/main/AndroidManifest.xml'
        defaultConfig {
            minSdk 26
            testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        }
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }
}

def configureRoom(Project sub) {
    sub.room { schemaDirectory("${sub.projectDir}/schemas") }
    // KMP naming trap: kspAndroidTest is the JVM unit-test source set.
    sub.configurations.matching { it.name in ['kspAndroid', 'kspDesktop', 'kspAndroidTest'] }.configureEach {
        sub.dependencies.add(it.name, libs.room.compiler)
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
